# Copy to secret.yaml, fill in, `kubectl apply -f secret.yaml -n konect`. Do NOT commit the copy.
# The local key half: `openssl rand -base64 32` — BACK IT UP apart from the data (a data backup never carries it).
apiVersion: v1
kind: Secret
metadata:
  name: konect
  namespace: konect
type: Opaque
stringData:
  konect-local.key: "<base64 of 32 random bytes>"
  # The install token (download only; SparkHub → Konect → Install). The bootstrap removes it before Konect starts.
  KONECT_INSTALL_TOKEN: "kit_<org>.<id>.<secret>"
  # Optional, with the KONECT_IDP_* values below (all or none; none = sign-in configured in the UI after Connect):
  KONECT_IDP_CLIENT_SECRET: "<the OIDC client secret>"
  # Postgres shape only:
  # KONECT_POSTGRES_URL: "postgres://konect:<password>@<host>:5432/konect"
---
# Deployment values that are not secret (the container template reads them; `konect init --container` prints the list).
apiVersion: v1
kind: ConfigMap
metadata:
  name: konect
  namespace: konect
data:
  # The exact Konect version to run (no "latest"). Change it and roll the Deployment to upgrade.
  KONECT_VERSION: "0.7.0"
  KONECT_BASE_URL: "https://konect.example.com"
  # Optional, all or none (with KONECT_IDP_CLIENT_SECRET in the Secret): a deploy-time company sign-in.
  KONECT_IDP_ISSUER: "https://login.microsoftonline.com/<tenant id>/v2.0"
  KONECT_IDP_CLIENT_ID: "<client id>"
  KONECT_IDP_ALLOWED_GROUP: "<group object id allowed to sign in>"
  KONECT_IDP_ADMIN_GROUP: "<admin group object id>"
  # Optional: which SparkHub this Konect connects to (prod | preprod; default prod). Connect it from the UI after the deploy.
  # KONECT_SPARKHUB: "prod"          # the bootstrap reads it too (preprod: a pre-release may run)
  # Postgres shape over TCP (deployment-postgres.yaml): the server CA bundle the image ships, or your own mount
  # KONECT_POSTGRES_CA: /etc/konect/ca/rds-global-bundle.pem
