# TLS terminates here (cert-manager, or a certificate Secret you manage). The config trusts ONE proxy hop (X-Forwarded-For).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: konect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 25m   # the API accepts 20 MiB bodies
spec:
  ingressClassName: nginx
  tls:
    - hosts: [konect.example.com]
      secretName: konect-tls
  rules:
    - host: konect.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: konect
                port:
                  name: http
